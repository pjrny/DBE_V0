name: SDBES framework

on:
  push:
    branches: [SDBES]
  pull_request:
    branches: [SDBES]

jobs:
  framework:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install pytest
      - name: Validate JSON artifacts
        run: |
          python -m json.tool docs/SDBES/V4_R2_SCHEMA_TEMPLATE.json >/dev/null
          python -m json.tool docs/SDBES/tests/V1_V4_R2_EXISTING_CASES.json >/dev/null
      - name: Run V3 reference checks
        run: python tests/sdbes_v3_core_logic_checks.py
      - name: Run V4 R2 reference checks
        run: python tests/sdbes_v4_r2_core_logic_checks.py
      - name: Run V1 through V4 regression release gate
        run: python tests/sdbes_v1_v4_regression.py
      - name: Run V4 R2 second-pass requirement audit
        run: python tests/sdbes_v4_r2_requirement_audit.py
      - name: Rebuild and validate V5/V6 R2 assets
        run: |
          python scripts/build_v5_v6_assets.py
          git diff --exit-code -- docs/SDBES/data
          python tests/sdbes_v5_v6_integrity_checks.py
      - name: Run SDBES pytest adapters
        run: >-
          python -m pytest -q
          tests/test_sdbes_v4_r2.py
          tests/test_sdbes_v1_v4_regression.py
          tests/test_sdbes_v4_r2_requirement_audit.py
          tests/test_sdbes_v5_v6.py

  navigator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: navigator/package-lock.json
      - name: Install navigator dependencies
        working-directory: navigator
        run: npm ci
      - name: Test navigator
        working-directory: navigator
        run: npm run test
      - name: Build navigator
        working-directory: navigator
        run: npm run build

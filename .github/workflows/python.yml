name: Python package

on:
  push:
    branches: [ main, feature/research-grade-physics ]
  pull_request:
    branches: [ main, feature/research-grade-physics ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Run tests
        env:
          PYTHONPATH: .
        run: |
          # Observatory freeze tests plus the simulator tests that still match the package API.
          # Remaining controller/quantum/risk tests track the pre-cut five-head stubs and fail on purpose.
          pytest -q tests/test_research.py tests/test_claims.py tests/test_api.py tests/test_plasma.py tests/test_transport.py

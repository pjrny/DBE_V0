<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>DBE Observatory</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:#0a0b0d; --surface:#131418; --elevated:#1a1c22; --ink:#ebe6dc;
    --muted:#9b968c; --subtle:#6f6b64; --acc:#8aa4b0; --warn:#c4a574;
    --ok:#8faf9a; --danger:#c17b6b;
    --border:color-mix(in oklab, var(--ink) 12%, transparent);
    --radius-sm:8px; --radius:12px; --radius-lg:20px; --radius-xl:28px;
    --ease:cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); }
  body { font:16px/1.55 "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; }
  h1,h2,h3,h4 { font-family:"Fraunces", Georgia, serif; font-weight:500; letter-spacing:-0.03em; text-wrap:balance; }
  button:not(:disabled), [role="button"]:not(:disabled) { cursor:pointer; }
  header { max-width:72rem; margin:0 auto; padding:1.5rem 1.25rem 1.25rem; border-bottom:1px solid var(--border); }
  h1 { font-size:clamp(2rem,4vw,3rem); margin:0.35rem 0 0; }
  .kicker { text-transform:uppercase; letter-spacing:0.22em; font-size:0.75rem; color:var(--acc); margin:0; }
  .lede { max-width:42rem; color:var(--muted); margin:0.75rem 0 0; }
  .wrap { max-width:72rem; margin:0 auto; padding:1.25rem 1.25rem 4rem; }
  .rowish { display:flex; flex-wrap:wrap; gap:0.5rem; align-items:center; }
  .stat, .card, .run {
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:0.95rem 1.05rem;
  }
  .stats { display:grid; grid-template-columns:repeat(2,1fr); gap:0.75rem; margin-top:1.25rem; }
  @media (min-width:640px) { .stats { grid-template-columns:repeat(4,1fr); } }
  .stat dt { font-size:0.75rem; text-transform:uppercase; letter-spacing:0.16em; color:var(--subtle); }
  .stat dd { margin:0.25rem 0 0; font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:1.25rem; }
  nav.tabs { display:flex; gap:0.25rem; overflow-x:auto; background:var(--surface); padding:0.25rem; border-radius:var(--radius); border:1px solid var(--border); }
  nav.tabs button, .chip, select, input, .ghost, .btn {
    background:transparent; color:var(--muted); border:0; min-height:44px; padding:0 1rem; border-radius:var(--radius-sm); font:inherit;
  }
  nav.tabs button.active { background:var(--elevated); color:var(--ink); }
  .tools { display:flex; flex-wrap:wrap; gap:0.75rem; margin:1.1rem 0; }
  input, select { border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:var(--radius); padding:0 0.85rem; }
  input { flex:1; min-width:12rem; }
  .chips { display:flex; flex-wrap:wrap; gap:0.5rem; }
  .chip { border:1px solid var(--border); border-radius:999px; padding:0 0.85rem; font-size:0.9rem; }
  .chip.active { border-color:color-mix(in oklab, var(--acc) 40%, transparent); background:color-mix(in oklab, var(--acc) 12%, transparent); color:var(--ink); }
  .chip span { font-family:"IBM Plex Mono", monospace; font-size:0.75rem; color:var(--subtle); margin-left:0.4rem; }
  .tag { display:inline-flex; align-items:center; border:1px solid var(--border); border-radius:999px; padding:0.15rem 0.6rem; font-size:0.75rem; color:var(--muted); margin:0 0.3rem 0.3rem 0; white-space:nowrap; }
  .tag.acc { color:var(--acc); border-color:color-mix(in oklab, var(--acc) 35%, transparent); background:color-mix(in oklab, var(--acc) 10%, transparent); }
  .tag.warn { color:var(--warn); border-color:color-mix(in oklab, var(--warn) 35%, transparent); }
  .tag.ok { color:var(--ok); border-color:color-mix(in oklab, var(--ok) 35%, transparent); }
  .tag.danger { color:var(--danger); border-color:color-mix(in oklab, var(--danger) 35%, transparent); }
  .harvest { display:grid; grid-template-columns:repeat(3,1fr); gap:0.75rem; min-width:13rem; }
  .harvest .lbl { display:flex; justify-content:space-between; font-size:0.7rem; text-transform:uppercase; letter-spacing:0.12em; color:var(--subtle); }
  .bar { height:6px; background:var(--bg); border-radius:999px; overflow:hidden; margin-top:0.3rem; }
  .bar i { display:block; height:100%; background:var(--acc); }
  .list { margin-top:1.25rem; border-top:1px solid var(--border); }
  .row { width:100%; text-align:left; display:flex; flex-direction:column; gap:0.85rem; padding:1.15rem 0; border-bottom:1px solid var(--border); background:transparent; color:inherit; border-left:0; border-right:0; }
  @media (min-width:800px) { .row { flex-direction:row; justify-content:space-between; } }
  .row h3 { font-size:1.25rem; margin:0.35rem 0 0.2rem; }
  .meta { color:var(--muted); font-size:0.9rem; }
  .grid { display:grid; gap:0.85rem; margin-top:1.25rem; }
  @media (min-width:800px) { .grid { grid-template-columns:1fr 1fr; } }
  .grid3 { display:grid; gap:0.85rem; margin-top:1.25rem; }
  @media (min-width:900px) { .grid3 { grid-template-columns:1fr 1fr 1fr; } }
  .overlay { position:fixed; inset:0; background:color-mix(in oklab, var(--bg) 72%, transparent); display:flex; align-items:flex-end; justify-content:center; z-index:20; }
  @media (min-width:640px) { .overlay { align-items:center; padding:1.5rem; } }
  .panel { position:relative; width:min(44rem,100%); max-height:92dvh; overflow:auto; background:var(--elevated); border:1px solid var(--border); border-radius:var(--radius-xl) var(--radius-xl) 0 0; padding:1.25rem; }
  @media (min-width:640px) { .panel { border-radius:var(--radius-xl); padding:2rem; } }
  a { color:var(--acc); }
  table { width:100%; border-collapse:collapse; font-size:0.95rem; }
  .scroll { overflow-x:auto; }
  th { text-align:left; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.14em; color:var(--subtle); font-weight:500; padding:0.5rem 0.4rem; }
  td { border-top:1px solid var(--border); padding:0.7rem 0.4rem; vertical-align:top; }
  .mono { font-family:"IBM Plex Mono", ui-monospace, monospace; }
  .empty { color:var(--muted); margin-top:2rem; }
  .axis { display:inline-flex; gap:0.4rem; font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:0.75rem; white-space:nowrap; }
  .axis b { color:var(--subtle); font-weight:500; }
  .notice { border:1px dashed color-mix(in oklab, var(--acc) 35%, transparent); background:color-mix(in oklab, var(--acc) 8%, transparent); border-radius:var(--radius); padding:0.85rem 1rem; color:var(--muted); font-size:0.9rem; margin:1rem 0; }
  .btn { border:1px solid var(--border); background:var(--elevated); color:var(--ink); }
  .btn.ok { border-color:color-mix(in oklab, var(--ok) 40%, transparent); color:var(--ok); }
  .btn.warn { border-color:color-mix(in oklab, var(--warn) 40%, transparent); color:var(--warn); }
  .timeline { border-left:1px solid var(--border); margin-left:0.5rem; }
  .timeline .run { margin:0 0 0.85rem 1rem; position:relative; }
  .timeline .run::before { content:""; position:absolute; left:-1.28rem; top:1.15rem; width:8px; height:8px; border-radius:99px; background:var(--acc); }
  .gate { display:grid; grid-template-columns:auto 1fr; gap:0.35rem 0.75rem; font-size:0.9rem; }
  .gate span { font-family:"IBM Plex Mono", ui-monospace, monospace; color:var(--acc); }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<header>
  <p class="kicker">DBE source ledger</p>
  <h1>Observatory</h1>
  <p class="lede">Three layers, never mixed: a paper library with harvest gauges, a frozen C/T/D/A claim table, and a version log. Q = 1000 is a stress test of the ledger, not an output.</p>
  <dl class="stats" id="stats"></dl>
</header>
<div class="wrap">
  <nav class="tabs" id="tabs" aria-label="Observatory layers"></nav>
  <div id="tools"></div>
  <div id="main">Loading catalog, claims, versions, reviews, and ledger…</div>
</div>
<script>
const NOW = new Date("2026-09-20T09:44:00-05:00");
const QUEUE_KEY = "dbe-weekly-freeze";
const TABS = [
  ["week","Library · week"],["month","Month"],["lookback","Year lookback"],["all","Full catalog"],
  ["pillars","Pillars"],["runs","Daily runs"],["claims","Claims"],["versions","Versions"],["ledger","Q ledger"]
];
const FIELD_ALIAS = {
  anyons:"anyons", "Anyons":"anyons",
  tqc:"tqc", TQC:"tqc", "Topological quantum computation":"tqc",
  majorana:"majorana", Majorana:"majorana",
  "braid-knot":"braid-knot", "Braid & Knot Theory":"braid-knot", Braids:"braid-knot",
  topology:"topology", Topology:"topology",
  fracton:"fracton", "Fracton Memory":"fracton", Fractons:"fracton",
  "time-crystal":"time-crystal", "Time Crystals":"time-crystal", Floquet:"time-crystal",
  plasma:"plasma", "Plasma Control":"plasma", Plasma:"plasma",
  holography:"holography", Holography:"holography",
  "fusion-quantum":"fusion-quantum", "Fusion–Quantum Integration":"fusion-quantum", "Fusion⊗Q":"fusion-quantum"
};
const PROTOCOL = {
  PATCH: "Bibliography, wording, or a citation that does not move C/T/D. Daily run with zero claim edits. Automatic after the daily close.",
  MINOR: "Existing claim C moves ±1, T or D moves, a milestone is recorded, or a HOLD is strengthened in place. Automatic only if Auto-Gate A1–A8 pass.",
  MAJOR: "New pillar, retired pillar, bus coupling promoted, Q definition changed, or a CUT reversed. Never automatic. Weekly board only."
};
const AUTOGATE = [
  ["A1","Binds to exactly one existing KEEP or HOLD claim ID."],
  ["A2","G1–G6 all pass."],
  ["A3","Action is STRENGTHEN or INCLUDE, not NEW PILLAR, not a CUT reversal."],
  ["A4","New C ≥ 4, or C stays put and a published numerical bound tightens."],
  ["A5","Venue is a journal or a replicated hardware result. Bare arXiv cannot auto-raise C."],
  ["A6","Does not add a new mechanism, bus, fuel, or coupling sentence."],
  ["A7","Does not increase the number of active HOLD items."],
  ["A8","Ledger terms, if touched, move in the conservative direction."]
];
const GATES = [
  ["G1","Closed equations — Hamiltonian / rate / map written; symbols defined; units consistent."],
  ["G2","Conservation / 2nd law — energy, particle, charge, or unitarity ledger does not leak."],
  ["G3","Baseline — compares to a named published baseline."],
  ["G4","Distinguisher — states what result would refute it."],
  ["G5","Platform honesty — a processor analog is not a tokamak / XFEL result. Cap C at 3."],
  ["G6","Coupling ban — does not raise claim Y because claim X looked good."]
];

let CAT = { papers:[], pillars:[], fields:[], feeds:[], runs:[], protocol:{} };
let CLAIMS = { claims:[], axes:{}, rule:"" };
let VERS = {};
let LEDGER = {};
let REVIEWS = { cards:[] };
let tab = "week", field = "all", q = "", sort = "importance", selectedClaim = "E-S3";

function esc(s) {
  return String(s ?? "")
    .replace(/&/g, "\u0026amp;")
    .replace(/</g, "\u0026lt;")
    .replace(/>/g, "\u0026gt;")
    .replace(/"/g, "\u0026quot;")
    .replace(/'/g, "\u0026#39;");
}
const fid = (f) => FIELD_ALIAS[f] || String(f).toLowerCase().replace(/\s+/g,"-");
const fieldsOf = (p) => (p.fields || []).map(fid);
const idea = (p) => p.coreIdea || p.plain || (p.plain && p.plain.core) || "";
const why = (p) => p.whyItMatters || p.why_matters || p.why || "";
const lim = (p) => p.limitation || "";
const fieldLabel = (id) => (CAT.fields.find(f => f.id === id)?.short || id);
const authors = (p) => Array.isArray(p.authors) ? p.authors : String(p.authors || "").split(",").map(s => s.trim()).filter(Boolean);
const pdate = (p) => p.date || p.published || (p.year ? `${p.year}-01-01` : "");
const claimIds = (p) => p.claimIds || p.bind || [];
const inWeek = (p) => { const d = Date.parse(pdate(p)); return (isFinite(d) && (NOW - d) <= 7*864e5) || p.role === "week" || p.segment === "week"; };
const inMonth = (p) => String(pdate(p)).startsWith("2026-09") || p.role === "month" || inWeek(p);
const inLookback = (p) => pdate(p) >= "2025-09-20" || ["lookback","week","month"].includes(p.role) || p.segment === "year";
const isFound = (p) => p.foundational || p.role === "pillar" || p.role === "internal";
function roleLabel(p){
  if (p.role === "internal") return "Program source";
  if (isFound(p) && (p.role === "pillar" || p.foundational)) return "Foundational";
  if (inWeek(p)) return "This week";
  if (inMonth(p)) return "This month";
  if (inLookback(p)) return "Year lookback";
  return p.role || "Catalog";
}
function axisDigit(val){
  if (val == null || val === "") return null;
  if (typeof val === "number") return val;
  const m = String(val).match(/\d/);
  return m ? +m[0] : null;
}
function axisOf(c){
  return {
    C: axisDigit(c.C ?? c.c),
    T: axisDigit(c.T ?? c.t),
    D: axisDigit(c.D ?? c.d),
    A: axisDigit(c.A ?? c.a)
  };
}
function claimDoc(c){ return c.doc || c.document || ""; }
function dbeVer(){ return (VERS.current && (VERS.current.DBE || VERS.current.dbe)) || (VERS.dbe && VERS.dbe.current) || (CAT.protocol && CAT.protocol.dbe) || "—"; }
function dbesVer(){ return (VERS.current && (VERS.current.DBES || VERS.current.dbes)) || (VERS.dbes && VERS.dbes.current) || (CAT.protocol && CAT.protocol.dbes) || "—"; }
function versionHistory(){
  if (Array.isArray(VERS.history)) {
    return VERS.history.map(h => ({
      date: h.date,
      version: h.version,
      line: String(h.version || "").startsWith("DBES") ? "DBE-S" : "DBE",
      kind: h.kind || h.bump,
      action: h.action,
      title: h.title,
      summary: h.summary,
      auto: /PATCH|INCLUDE/i.test(h.kind || "") && h.kind !== "MAJOR",
      claimIds: Object.keys(h.claimSnapshot || {}),
      snapshot: h.claimSnapshot || {},
      paperIds: h.paperIds || [],
      runId: h.runId
    }));
  }
  return (VERS.changelog || []).map(l => ({
    date: l.date, version: l.line ? `${l.line}-${l.version}` : l.version,
    line: l.line, kind: l.bump, action: l.action, title: l.title || l.summary,
    summary: l.summary, auto: !!l.auto, claimIds: l.claimIds || [], snapshot: {},
    paperIds: l.paperIds || [], runId: l.runId
  }));
}
function buses(){ return VERS.buses || CLAIMS.buses || []; }
function milestones(){ return VERS.milestones || CLAIMS.milestones || []; }
function harvestMeters(p){
  const row = (label, n) => `<div><div class="lbl"><span>${label}</span><span>${n ?? "—"}</span></div><div class="bar"><i style="width:${Math.max(4, Math.min(100, n || 0))}%"></i></div></div>`;
  return `<div class="harvest" title="Harvest metadata only. Not C, T, D, or A.">${row("Importance", p.importance)}${row("Confidence", p.confidence)}${row("Popularity", p.popularity)}</div>`;
}
function statusTag(s){
  const u = String(s || "").toUpperCase();
  const cls = ["KEEP","PASS","ESTABLISHED","DONE","REQUIRED"].includes(u) ? "ok"
    : ["CUT","REJECT","DANGER"].includes(u) ? "danger"
    : ["HOLD","WATCH","SUGGESTED","QUEUE","MISSING","OPEN","PENDING","EXPIRE","STALE"].includes(u) ? "warn" : "";
  return `<span class="tag ${cls}">${esc(s)}</span>`;
}
function axisPills(c){
  const a = axisOf(c);
  return `<span class="axis"><b>C</b>${a.C ?? "—"} <b>T</b>${a.T ?? "—"} <b>D</b>${a.D ?? "—"} <b>A</b>${a.A ?? "—"}</span>`;
}
function claimById(id){ return (CLAIMS.claims || []).find(c => c.id === id); }
function paperById(id){ return (CAT.papers || []).find(p => p.id === id || p.arxiv === id); }
function loadDecisions(){
  try { return JSON.parse(localStorage.getItem(QUEUE_KEY) || "{}"); } catch { return {}; }
}
function saveDecisions(d){ localStorage.setItem(QUEUE_KEY, JSON.stringify(d)); }

function pool(){
  let papers = CAT.papers.slice();
  if (tab === "week") papers = papers.filter(inWeek);
  else if (tab === "month") papers = papers.filter(inMonth);
  else if (tab === "lookback") papers = papers.filter(inLookback);
  else if (tab === "pillars") papers = papers.filter(isFound);
  if (field !== "all") papers = papers.filter(p => fieldsOf(p).includes(field));
  if (q) {
    const s = q.toLowerCase();
    papers = papers.filter(p => [p.title, authors(p).join(" "), idea(p), why(p), lim(p), p.arxiv, ...(p.tags||[]), ...claimIds(p)].join(" ").toLowerCase().includes(s));
  }
  papers.sort((a,b) => sort === "date" ? String(pdate(b)).localeCompare(String(pdate(a))) : (b[sort]||0)-(a[sort]||0));
  return papers;
}
function openPaper(id){
  const p = paperById(id);
  if (!p) return;
  const bound = claimIds(p).map(claimById).filter(Boolean);
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.setAttribute("role","dialog");
  overlay.innerHTML = `<article class="panel">
    <p class="kicker">${esc(p.source || p.venue || "Library")}</p>
    <h2>${esc(p.title)}</h2>
    <p class="meta">${esc(authors(p).join(", "))} · ${esc(pdate(p))} · ${esc(p.venue || "")}</p>
    <div>${fieldsOf(p).map(f => `<span class="tag">${esc(fieldLabel(f))}</span>`).join("")}${claimIds(p).map(id => `<span class="tag acc">${esc(id)}</span>`).join("")}${p.bindAction ? `<span class="tag">${esc(p.bindAction)}</span>` : ""}</div>
    ${harvestMeters(p)}
    <p class="notice">Harvest gauges are ingest metadata (0–100). They are not C, T, D, or A and cannot raise a frozen claim.</p>
    ${bound.map(c => `<p class="meta">${esc(c.id)} ${statusTag(c.status)} ${axisPills(c)} · ${esc(c.verdict || "")}</p>`).join("")}
    <p><b>Core idea.</b> ${esc(idea(p))}</p>
    <p><b>Why it matters.</b> ${esc(why(p))}</p>
    <p><b>One limitation.</b> ${esc(lim(p))}</p>
    <div class="rowish" style="margin-top:1rem">
      ${p.url && String(p.url).startsWith("http") ? `<a class="chip active" href="${esc(p.url)}" target="_blank" rel="noreferrer">Open source</a>` : ""}
      ${p.arxiv ? `<a class="chip" href="https://arxiv.org/abs/${esc(p.arxiv)}" target="_blank" rel="noreferrer">${esc(p.arxiv)}</a>` : ""}
      <button class="ghost" type="button">Close</button>
    </div>
  </article>`;
  overlay.addEventListener("click", e => { if (e.target === overlay || e.target.closest(".ghost")) overlay.remove(); });
  document.body.appendChild(overlay);
}
function paperRow(p){
  return `<button class="row" data-id="${esc(p.id)}" type="button">
    <div>
      <div>${isFound(p) ? `<span class="tag acc">Foundational</span>` : `<span class="tag">${esc(roleLabel(p))}</span>`}
        ${claimIds(p).map(id => `<span class="tag acc">${esc(id)}</span>`).join("")}
        <span class="meta">${esc(pdate(p))}</span></div>
      <h3>${esc(p.title)}</h3>
      <p class="meta">${esc(authors(p).slice(0,4).join(", "))} · ${esc(p.venue || "")}</p>
      <p>${esc(idea(p))}</p>
    </div>${harvestMeters(p)}
  </button>`;
}
function renderLibrary(){
  const papers = pool();
  const counts = {};
  for (const p of CAT.papers) for (const f of fieldsOf(p)) counts[f] = (counts[f] || 0) + 1;
  const chips = `<div class="chips">${[["all","All fields", CAT.papers.length], ...(CAT.fields||[]).map(f => [f.id, f.short, counts[f.id] || 0])].map(([id,label,n]) =>
    `<button class="chip ${field===id?"active":""}" data-field="${esc(id)}" type="button">${esc(label)}<span>${n}</span></button>`).join("")}</div>`;
  document.getElementById("tools").innerHTML = `<div class="tools">
    <input id="q" value="${esc(q)}" placeholder="Search title, author, arXiv, idea, claim ID"/>
    <select id="sort">
      <option value="importance" ${sort==="importance"?"selected":""}>Sort: importance</option>
      <option value="confidence" ${sort==="confidence"?"selected":""}>Sort: confidence</option>
      <option value="popularity" ${sort==="popularity"?"selected":""}>Sort: popularity</option>
      <option value="date" ${sort==="date"?"selected":""}>Sort: date</option>
    </select>
  </div>${chips}
  <p class="notice">Library layer. Importance / confidence / popularity are harvest metadata from ingest. Physics confidence lives on a named claim ID in the Claims tab.</p>`;
  document.getElementById("q").oninput = e => { q = e.target.value; render(); };
  document.getElementById("sort").onchange = e => { sort = e.target.value; render(); };
  document.querySelectorAll("[data-field]").forEach(b => b.onclick = () => { field = b.dataset.field; render(); });
  document.getElementById("main").innerHTML = papers.length ? `<div class="list">${papers.map(paperRow).join("")}</div>` : `<p class="empty">No papers in this slice.</p>`;
}
function renderPillars(){
  document.getElementById("tools").innerHTML = `<p class="notice">Foundational papers may be any age. A suggested pillar needs an interface contract (in / out / latency / fail-safe) before a MAJOR bump. One NEW PILLAR proposal per month. Holography, consciousness, five-way coupling, time-crystal-as-clock, and fracton-as-hardware stay on the denylist.</p>`;
  const groups = [
    ["established","Established"],["suggested","Suggested"],["watch","Watch"],["hold","Hold"],["cut","Cut"],["QUEUE","Queued"]
  ];
  document.getElementById("main").innerHTML = groups.map(([g,label]) => {
    const list = (CAT.pillars || []).filter(p => p.status === g || p.engineStatus === g);
    if (!list.length) return "";
    return `<h2>${label}</h2><div class="grid">${list.map(p => `<article class="card">
      <div style="display:flex;justify-content:space-between;gap:0.75rem;align-items:flex-start">
        <h3>${esc(p.name)}</h3>${statusTag(p.engineStatus || p.status)}
      </div>
      <p>${esc(p.statement || "")}</p>
      <p class="meta">${esc(p.dbeGoal || "")}</p>
      ${p.whySuggested ? `<p style="color:var(--acc)">${esc(p.whySuggested)}</p>` : ""}
      ${p.engineNote ? `<p style="color:var(--warn)">${esc(p.engineNote)}</p>` : ""}
      ${p.frameworkNote ? `<p style="color:var(--warn)">${esc(p.frameworkNote)}</p>` : ""}
      <div>${(p.fields || []).map(f => `<span class="tag">${esc(fieldLabel(fid(f)))}</span>`).join("")}</div>
      <div class="rowish">${(p.evidence || []).map(id => `<button class="chip" data-open="${esc(id)}" type="button">${esc((paperById(id)||{}).title || id)}</button>`).join("")}</div>
    </article>`).join("")}</div>`;
  }).join("") || `<p class="empty">No pillars in catalog.json.</p>`;
}
function renderRuns(){
  document.getElementById("tools").innerHTML = `<p class="notice">Daily ingest writes a run file. It does not version the paper. A card without DISPUTER and GATES is void.</p>`;
  const feeds = (CAT.feeds || []).map(f => {
    const label = f.label || f.id || f;
    const url = f.url || (typeof f === "string" && f.startsWith("http") ? f : "");
    return `<li class="meta" style="display:flex;justify-content:space-between;gap:1rem;padding:0.6rem 0;border-bottom:1px solid var(--border)"><span>${esc(label)}</span>${url ? `<a href="${esc(url)}">${esc(String(url).replace("https://",""))}</a>` : ""}</li>`;
  }).join("");
  const cards = (REVIEWS.cards || []).slice().sort((a,b) => String(b.date).localeCompare(String(a.date)));
  const runHtml = (CAT.runs || []).map(r => `<div class="run">${statusTag(r.kind)} <span class="meta">${esc(r.startedAt || r.id || "")}</span>
    <p>${esc(r.notes || "")}</p>
    <p class="meta">${esc(r.windowStart || "")} → ${esc(r.windowEnd || "")} · ${(r.paperIds || []).length} papers</p>
    <div class="rowish">${(r.paperIds || []).map(id => `<button class="chip" data-open="${esc(id)}" type="button">${esc((paperById(id)||{}).title || id)}</button>`).join("")}</div>
  </div>`).join("");
  const reviewHtml = cards.map(c => {
    const gates = typeof c.gates === "string" ? c.gates : Object.entries(c.gates || {}).filter(([k]) => k !== "note").map(([k,v]) => `${k} ${v}`).join(" · ");
    const paper = paperById(c.paperId || c.id);
    const plain = c.plain || {};
    return `<article class="card">
      <div class="rowish">${statusTag(c.action)} ${statusTag(c.route)} ${ (c.bind || []).map(id => `<span class="tag acc">${esc(id)}</span>`).join("") }</div>
      <h3>${esc((paper && paper.title) || c.paper || c.paperId || c.id)}</h3>
      <p class="meta">${esc(c.date || "")} · ${esc(c.version || "no version")}</p>
      <p><b>Core idea.</b> ${esc(plain.core || c.coreIdea || (paper && idea(paper)) || "")}</p>
      <p><b>Why it matters.</b> ${esc(plain.why || c.whyItMatters || "")}</p>
      <p><b>Limitation.</b> ${esc(plain.limit || c.limitation || "")}</p>
      <p class="meta">Gates. ${esc(gates)}${c.gateNote ? " · " + esc(c.gateNote) : ""}</p>
      <p class="meta">Disputer. ${esc(c.disputer || "void without a disputer")}</p>
      ${c.whyQueued ? `<p style="color:var(--warn)">${esc(c.whyQueued)}</p>` : ""}
      ${c.ledger && c.ledger !== "none" ? `<p class="mono meta">${esc(c.ledger)}</p>` : ""}
      ${paper ? `<button class="chip" data-open="${esc(paper.id)}" type="button">Open paper</button>` : ""}
    </article>`;
  }).join("");
  document.getElementById("main").innerHTML = `<h2>Feeds</h2><ul style="list-style:none;padding:0">${feeds}</ul>
    <h2>Ingest runs</h2>${runHtml || `<p class="empty">No runs recorded.</p>`}
    <h2>Daily review cards</h2><div class="grid">${reviewHtml || `<p class="empty">No reviews.json cards.</p>`}</div>`;
}
function renderClaims(){
  const rule = CLAIMS.rule || (CLAIMS.decisionRule && [CLAIMS.decisionRule.PASS, CLAIMS.decisionRule.HOLD, CLAIMS.decisionRule.CUT].filter(Boolean).join(" ")) || "";
  document.getElementById("tools").innerHTML = `<p class="notice">Claim layer. ${esc(rule)} Coupling starts at C1. Harvest scores cannot move these numbers.</p>`;
  const rows = (doc) => (CLAIMS.claims || []).filter(c => claimDoc(c) === doc).map(c => `<tr>
    <td><button class="ghost" data-claim="${esc(c.id)}" type="button" style="padding:0;min-height:auto;color:${selectedClaim===c.id?"var(--acc)":"var(--ink)"}">${esc(c.id)}</button></td>
    <td>${esc(c.claim || c.name)}</td><td>${axisPills(c)}</td><td>${statusTag(c.status)}</td>
  </tr>`).join("");
  const c = claimById(selectedClaim) || CLAIMS.claims[0];
  const busCards = buses().map(b => {
    const ids = (CLAIMS.claims || []).filter(x => x.bus === b.id).map(x => x.id);
    return `<article class="card"><p class="kicker">Bus ${esc(b.id)}</p><h3>${esc(b.name)}</h3>
      <p class="meta">${esc(b.C || "")} · ${esc(b.D || "")}${b.quantum ? " · quantum" : " · classical"}</p>
      <p>${esc(b.target || "")}</p>
      <p class="meta">${esc(b.interface || "")}</p>
      <p class="meta">${esc(b.metric || "")}</p>
      <div>${(b.claims || ids).map(id => `<button class="chip" data-claim="${esc(id)}" type="button">${esc(id)}</button>`).join("")}</div>
    </article>`;
  }).join("");
  const bound = c ? (CAT.papers || []).filter(p => claimIds(p).includes(c.id) || (c.evidence || []).includes(p.id)) : [];
  const hist = ((c && c.history) || []).map(h => `<p class="meta">${esc(h.date)} ${axisPills(h)} — ${esc(h.note)}</p>`).join("");
  document.getElementById("main").innerHTML = `
    <div class="scroll">
      <h2>DBE engine</h2>
      <table><thead><tr><th>ID</th><th>Claim</th><th>C T D A</th><th>Status</th></tr></thead><tbody>${rows("DBE")}</tbody></table>
      <h2>DBE-S</h2>
      <table><thead><tr><th>ID</th><th>Claim</th><th>C T D A</th><th>Status</th></tr></thead><tbody>${rows("DBE-S")}</tbody></table>
    </div>
    ${c ? `<article class="card" style="margin-top:1.25rem">
      <p class="mono">${esc(c.id)}</p><h3>${esc(c.name)}</h3>
      <p>${statusTag(c.status)} ${axisPills(c)} ${c.bus ? `<span class="tag acc">Bus ${esc(c.bus)}</span>` : `<span class="tag warn">No bus</span>`}</p>
      <p>${esc(c.verdict || "")}</p>
      ${c.cNote ? `<p class="meta">${esc(c.cNote)}</p>` : ""}
      <p><b>Disputer.</b> ${esc(c.disputer || "")}</p>
      <p class="meta"><b>Kill.</b> ${esc(c.kill || "")}</p>
      ${hist ? `<p class="meta">History</p>${hist}` : ""}
      <p class="meta">Bound papers</p>
      <div class="rowish">${bound.map(p => `<button class="chip" data-open="${esc(p.id)}" type="button">${esc(p.title)}</button>`).join("")}${(c.evidence||[]).filter(id => !bound.some(p => p.id === id)).map(id => `<button class="chip" data-open="${esc(id)}" type="button">${esc((paperById(id)||{}).title || id)}</button>`).join("")}</div>
    </article>` : ""}
    <h2>Three buses</h2>
    <p class="meta">Nothing rides two buses until it has passed on one.</p>
    <div class="grid3">${busCards}</div>
    <h2>Math / physics gates</h2>
    <div class="card gate">${GATES.map(([k,v]) => `<span>${k}</span><span style="color:var(--muted)">${esc(v)}</span>`).join("")}</div>
    <h2>Milestones</h2>
    ${(milestones() || []).map(m => `<div class="run">${statusTag(m.status)} <b class="mono">${esc(m.id)}</b> ${esc(m.name)}<p class="meta">${esc(m.note || "")}</p></div>`).join("")}`;
}
function renderVersions(){
  document.getElementById("tools").innerHTML = `<p class="notice">Version layer. A paper never versions the project. It versions a named claim. Ingest is not a version. Decisions on the freeze board stay on this device until a weekly freeze is published.</p>`;
  const hist = versionHistory();
  const lines = VERS.lines || [
    { id:"DBE", current:dbeVer(), meaning:(VERS.dbe && VERS.dbe.meaning) || "Modular quantum-topological processor + plasma controller", freeze:(VERS.dbe && VERS.dbe.freeze) || "" },
    { id:"DBES", current:dbesVer(), meaning:(VERS.dbes && VERS.dbes.meaning) || "Floquet / laser-RF driven tunneling", freeze:(VERS.dbes && VERS.dbes.freeze) || "" }
  ];
  const proto = Object.entries(VERS.protocol && !Array.isArray(VERS.protocol) && typeof VERS.protocol.PATCH === "string" ? VERS.protocol : PROTOCOL);
  const queued = (REVIEWS.cards || []).filter(c => /QUEUE/i.test(c.route || "") || c.action === "NEW PILLAR" || c.action === "HOLD");
  const decisions = loadDecisions();
  const freeze = queued.map(c => {
    const d = decisions[c.id] || "pending";
    const paper = paperById(c.paperId || c.id);
    return `<article class="card" data-qid="${esc(c.id)}">
      <div class="rowish">${statusTag(c.action)} ${statusTag(c.route)} ${statusTag(d)} ${(c.bind||[]).map(id => `<span class="tag acc">${esc(id)}</span>`).join("")}</div>
      <h3>${esc((paper && paper.title) || c.paper || c.paperId || c.id)}</h3>
      <p class="meta">BIND ${(c.bind||[]).join(", ") || "none"} · ${esc(c.version || "none")}</p>
      <p class="meta">Disputer. ${esc(c.disputer || "")}</p>
      ${c.whyQueued ? `<p style="color:var(--warn)">${esc(c.whyQueued)}</p>` : ""}
      <p class="meta">Cap: at most 3 QUEUE items promoted per weekly freeze. A CUT reversal needs two independent C≥4 sources.</p>
      <div class="rowish" style="margin-top:0.75rem">
        <button class="btn ok" data-decide="accept" type="button">Accept to freeze</button>
        <button class="btn warn" data-decide="expire" type="button">Expire as stale</button>
        <button class="ghost" data-decide="pending" type="button">Clear</button>
      </div>
    </article>`;
  }).join("");
  document.getElementById("main").innerHTML = `
    <div class="grid">
      ${lines.map(l => `<article class="card"><p class="kicker">${esc(l.name || l.id)}</p><h2 class="mono">${esc(l.current)}</h2><p class="meta">${esc(l.freeze || "")}</p><p>${esc(l.meaning || "")}</p></article>`).join("")}
    </div>
    <h2>What a digit means</h2>
    <div class="grid3">${proto.map(([k,v]) => `<article class="card"><p class="mono">${esc(k)}</p><p class="meta">${esc(v)}</p></article>`).join("")}</div>
    <h2>Auto-Gate</h2>
    <p class="meta">The only way a daily run versions the paper without a human. One miss → QUEUE, not bump. WEAKEN and DISCONFIRM that bind to one ID are always automatic.</p>
    <div class="card gate">${AUTOGATE.map(([k,v]) => `<span>${k}</span><span style="color:var(--muted)">${esc(v)}</span>`).join("")}</div>
    <h2>Version log</h2>
    <div class="timeline">${hist.map(l => `<div class="run">
      <span class="mono meta">${esc(l.date)}</span> ${statusTag(l.kind)} ${statusTag(l.action)}
      <span class="tag acc">${esc(l.version)}</span> ${l.auto ? `<span class="tag">AUTO-MERGED</span>` : `<span class="tag warn">manual</span>`}
      <h3>${esc(l.title || "")}</h3>
      <p>${esc(l.summary)}</p>
      <div>${(l.claimIds||[]).map(id => `<span class="tag acc">${esc(id)}</span>`).join("")}</div>
      ${Object.keys(l.snapshot||{}).length ? `<p class="meta">${Object.entries(l.snapshot).map(([k,v]) => `${esc(k)}: ${esc(v)}`).join(" · ")}</p>` : ""}
    </div>`).join("")}</div>
    <h2>Weekly freeze board</h2>
    <p class="meta">Queue items older than 14 days expire to REJECT with reason “stale.” Decisions here do not bump C until a freeze is published.</p>
    <div class="grid">${freeze || `<p class="empty">No QUEUE cards.</p>`}</div>`;
  document.querySelectorAll("[data-qid]").forEach(card => {
    card.querySelectorAll("[data-decide]").forEach(btn => btn.onclick = () => {
      const next = loadDecisions();
      const v = btn.dataset.decide;
      if (v === "pending") delete next[card.dataset.qid]; else next[card.dataset.qid] = v;
      saveDecisions(next); render();
    });
  });
}
function renderLedger(){
  document.getElementById("tools").innerHTML = `<p class="notice">${esc(LEDGER.northStar || LEDGER.note || "Q = 1000 is a stress test of this ledger, not an output of the current stack.")}</p>`;
  const defs = LEDGER.definitions || (LEDGER.numbers || []).map(n => ({ id:n.id, name:n.label, meaning:n.role, current:n.value ?? n.range }));
  const terms = LEDGER.terms || (LEDGER.auxTerms || []).map(t => ({ id:t.id, name:t.id, required:true, note:t.note, status:t.status }));
  const bases = LEDGER.baselines || [];
  const l2 = LEDGER.layer2 || {};
  document.getElementById("main").innerHTML = `
    <div class="grid">${defs.map(n => `<article class="card"><p class="mono">${esc(n.id)}</p><h3>${esc(n.name || n.label || n.id)}</h3>
      <p class="mono" style="font-size:1.15rem;margin-top:0.6rem">${esc(n.current || n.value || "—")}</p>
      <p class="meta">${esc(n.meaning || n.source || n.role || "")}</p></article>`).join("")}</div>
    <h2>Required auxiliary terms</h2>
    <p class="meta">A stack that cannot fill the ledger is not a stack. Optimistic ledger moves are manual.</p>
    ${terms.map(t => `<div class="run">${statusTag(t.status || (t.required ? "required" : "optional"))} <b class="mono">${esc(t.id)}</b> ${esc(t.name && t.name !== t.id ? t.name : "")}<p class="meta">${esc(t.note || "")}</p></div>`).join("")}
    <h2>Baselines</h2>
    <div class="grid">${bases.map(b => `<article class="card"><p class="meta">${esc(b.date || "")}</p><h3>${esc(b.label)}</h3><p class="mono">${esc(b.value)}</p></article>`).join("") || ""}</div>
    <article class="card"><h3>Layer 2 field bound</h3>
      <p>${esc(l2.prc109 || (l2.E_V_per_m ? "E = " + l2.E_V_per_m : ""))}</p>
      <p>${esc(l2.prc110 || (l2.I_W_cm2 ? "I = " + l2.I_W_cm2 : ""))}</p>
      <p class="meta">${esc(l2.kill || "")}</p>
    </article>`;
}
function render(){
  if (["week","month","lookback","all"].includes(tab)) renderLibrary();
  else if (tab === "pillars") renderPillars();
  else if (tab === "runs") renderRuns();
  else if (tab === "claims") renderClaims();
  else if (tab === "versions") renderVersions();
  else if (tab === "ledger") renderLedger();
  document.getElementById("main").querySelectorAll("[data-id], [data-open]").forEach(btn =>
    btn.addEventListener("click", () => openPaper(btn.dataset.id || btn.dataset.open)));
  document.getElementById("main").querySelectorAll("[data-claim]").forEach(b => b.onclick = () => { selectedClaim = b.dataset.claim; tab = "claims"; setupNav(); render(); });
}
function setupNav(){
  document.getElementById("tabs").innerHTML = TABS.map(([id,label]) => `<button data-tab="${id}" class="${id===tab?"active":""}" type="button">${label}</button>`).join("");
}
function setup(){
  const papers = CAT.papers || [];
  const keep = (CLAIMS.claims || []).filter(c => c.status === "KEEP").length;
  const queued = (CAT.pillars || []).filter(p => p.status === "suggested" || p.engineStatus === "QUEUE").length;
  document.getElementById("stats").innerHTML = [
    ["Sources", papers.length],
    ["KEEP claims", keep],
    ["DBE", dbeVer()],
    ["DBE-S", dbesVer()],
  ].map(([k,v]) => `<div class="stat"><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("");
  setupNav();
  document.getElementById("tabs").onclick = e => {
    const b = e.target.closest("[data-tab]"); if (!b) return;
    tab = b.dataset.tab;
    setupNav();
    render();
  };
  render();
}
Promise.all([
  fetch("catalog.json").then(r => r.json()),
  fetch("claims.json").then(r => r.json()),
  fetch("versions.json").then(r => r.json()),
  fetch("ledger.json").then(r => r.json()),
  fetch("reviews.json").then(r => r.ok ? r.json() : { cards:[] }).catch(() => ({ cards:[] })),
]).then(([c, cl, v, l, rv]) => {
  CAT = c; CLAIMS = cl; VERS = v; LEDGER = l; REVIEWS = rv || { cards:[] };
  setup();
}).catch(() => {
  document.getElementById("main").innerHTML = "<p class='empty'>Serve this folder so catalog.json, claims.json, versions.json, ledger.json, and reviews.json can load. From research/: python -m http.server 8000</p>";
});
</script>
</body>
</html>
